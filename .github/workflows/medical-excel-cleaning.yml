name: medical-excel-cleaning

on:
  push:
    branches: [main]
    paths:
      - 'examples/medical-excel-cleaning/**'
      - '.github/workflows/medical-excel-cleaning.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/medical-excel-cleaning/**'
      - '.github/workflows/medical-excel-cleaning.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    defaults:
      run:
        working-directory: examples/medical-excel-cleaning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: examples/medical-excel-cleaning/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow

      - name: Run tests
        run: pytest -v tests/
